name: ikadevis CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: Lint, Test Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (fumée, chaîne financière, étalons)
        run: npm test

      - name: Build CSS (Tailwind précompilé)
        run: npm run build:css

      - name: Compile Distribution Bundle (esbuild)
        run: npm run build:js

      - name: Verify Bundle & CSS Existence
        run: |
          test -f app.compiled.js
          test -f tailwind.css
          echo "Bundle et CSS compilés avec succès."
