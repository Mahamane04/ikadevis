<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ikadevis — Calculateur de Devis BTP</title>
    <link rel="stylesheet" href="tailwind.css">
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/supabase.min.js"></script>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="preload" href="vendor/fonts/open-sans.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: #f1f5f9; 
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0;
            overflow: hidden;
        }

        .app-input, .app-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            color: #1e293b;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .app-input:focus, .app-select:focus {
            background-color: #ffffff;
            border-color: #e6222b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(230, 34, 43, 0.15);
        }

        .app-label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            background-color: #e6222b; color: white;
            padding: 0.75rem 1.25rem; border-radius: 0.75rem;
            font-size: 0.875rem; font-weight: 700;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(230, 34, 43, 0.2), 0 2px 4px -1px rgba(230, 34, 43, 0.1);
        }
        .btn-primary:hover { background-color: #dc2626; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(1px) scale(0.98); }

        .btn-secondary {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            background-color: white; color: #475569;
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1.25rem; border-radius: 0.75rem;
            font-size: 0.875rem; font-weight: 700;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .btn-secondary:hover { background-color: #f8fafc; border-color: #cbd5e1; color: #0f172a; }

        .btn-icon {
            width: 2.5rem; height: 2.5rem;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 0.5rem; color: #94a3b8;
            transition: all 0.15s ease;
        }
        .btn-icon:hover { background-color: #fee2e2; color: #dc2626; }

        .app-card {
            background-color: white;
            border-radius: 1rem;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        .app-table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .app-table { width: 100%; text-align: left; min-width: 600px; border-collapse: separate; border-spacing: 0; }
        .app-th { padding: 0.75rem 1rem; font-weight: 800; color: #64748b; text-transform: uppercase; font-size: 0.65rem; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .app-td { padding: 1rem; color: #334155; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }

        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

        /* P1.2 DEPARTURE A4 PRINT STYLESHEET */
        @media print {
            body * { visibility: hidden !important; }
            #printArea, #printArea * { visibility: visible !important; }
            #printArea {
                position: absolute !important;
                left: 0 !important; top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 1.5cm !important;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
            }
            @page { size: A4; margin: 1cm; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="config.js"></script>
    <script src="app.compiled.js"></script>
</body>
</html>
